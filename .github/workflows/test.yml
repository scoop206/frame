name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: zsh tests/run.sh --lint
      - name: Usage doc is current
        run: make check-usage
      - name: Test
        run: zsh tests/run.sh
