<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- frame notifier badge: neobrutalist tab row — three tabs over one tidy
       window on a terracotta tile, with a neovim-chamfered N inside. Source of
       truth for assets/frame_badge.png (render with transparent background —
       qlmanage flattens to white; see commands/notifier.sh). -->
  <rect x="18" y="18" width="100" height="100" rx="26" fill="#171613"/>
  <rect x="12" y="12" width="100" height="100" rx="26" fill="#D97757" stroke="#171613" stroke-width="5"/>
  <!-- three tabs: yellow one active -->
  <rect x="28" y="28" width="20" height="16" rx="4" fill="#FFD43B" stroke="#171613" stroke-width="3.5"/>
  <rect x="54" y="28" width="20" height="16" rx="4" fill="#FFF6E3" stroke="#171613" stroke-width="3.5"/>
  <rect x="80" y="28" width="20" height="16" rx="4" fill="#FFF6E3" stroke="#171613" stroke-width="3.5"/>
  <!-- window body -->
  <rect x="26" y="40" width="76" height="58" rx="5" fill="#FFFDF6" stroke="#171613" stroke-width="3.5"/>
  <!-- N with neovim-style chamfered pillars and diagonal -->
  <polygon points="46,58 52,52 57,52 57,90 46,90" fill="#D97757" stroke="#171613" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="57,52 71,74 71,90 57,68" fill="#D97757" stroke="#171613" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="71,52 82,52 82,84 76,90 71,90" fill="#A94F33" stroke="#171613" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
